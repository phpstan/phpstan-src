# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "API Reference Infra"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/apiref-infra.yml'
      - 'apigen/infra/**'
  push:
    branches:
      - "2.3.x"
    paths:
      - '.github/workflows/apiref-infra.yml'
      - 'apigen/infra/**'

concurrency: apiref-infra

jobs:
  test:
    name: "Test"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: "Install Node"
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apigen/infra/package-lock.json

      - name: "Install dependencies"
        working-directory: ./apigen/infra
        run: "npm ci"

      - name: "TypeScript check"
        working-directory: ./apigen/infra
        run: "npm run check"

      - name: "Unit tests"
        working-directory: ./apigen/infra
        run: "npm test"

      - name: "CDK synth"
        working-directory: ./apigen/infra
        run: "npx cdk synth --all --quiet"

  deploy:
    name: "Deploy"
    runs-on: "ubuntu-latest"
    needs: test
    if: "github.event_name == 'push' && github.ref == 'refs/heads/2.3.x'"
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: "Install Node"
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apigen/infra/package-lock.json

      - name: "Install dependencies"
        working-directory: ./apigen/infra
        run: "npm ci"

      - name: "Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.APIREF_INFRA_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: "CDK deploy"
        working-directory: ./apigen/infra
        run: "npx cdk deploy --all --require-approval never"

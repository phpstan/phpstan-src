# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "API Reference Infra"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/apiref-infra.yml'
      - 'apigen/infra/**'
  push:
    branches:
      - "2.3.x"
    paths:
      - '.github/workflows/apiref-infra.yml'
      - 'apigen/infra/**'

concurrency: apiref-infra

jobs:
  test:
    name: "Test"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install Node"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apigen/infra/package-lock.json

      - name: "Install dependencies"
        working-directory: ./apigen/infra
        run: "npm ci"

      - name: "TypeScript check"
        working-directory: ./apigen/infra
        run: "npm run check"

      - name: "Unit tests"
        working-directory: ./apigen/infra
        run: "npm test"

      - name: "CDK synth"
        working-directory: ./apigen/infra
        run: "npx cdk synth --all --quiet"

  deploy:
    name: "Deploy"
    runs-on: "ubuntu-latest"
    needs: test
    if: "github.event_name == 'push' && github.ref == 'refs/heads/2.3.x'"
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install Node"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apigen/infra/package-lock.json

      - name: "Install dependencies"
        working-directory: ./apigen/infra
        run: "npm ci"

      - name: "Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.APIREF_INFRA_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: "CDK deploy"
        working-directory: ./apigen/infra
        run: "npx cdk deploy --all --require-approval never"

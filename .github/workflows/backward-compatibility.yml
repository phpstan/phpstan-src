# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Backward Compatibility"

on:
  pull_request:
  push:
    branches:
      - "2.3.x"
    paths:
      - 'src/**'
      - '.github/workflows/backward-compatibility.yml'

concurrency:
  group: bc-${{ github.head_ref || github.run_id }} # will be canceled on subsequent pushes in pull requests but not branches
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backward-compatibility:
    name: "Backward Compatibility"

    runs-on: "ubuntu-latest"
    timeout-minutes: 60

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
        with:
          coverage: "none"
          php-version: "8.2"

      - uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # v4.0.0

      - name: "Install BackwardCompatibilityCheck"
        run: |
          composer global config minimum-stability dev
          composer global config prefer-stable true
          composer global require --dev ondrejmirtes/backward-compatibility-check:^7.3.0.1

      - name: "Check"
        run: '"$(composer global config bin-dir --absolute)"/roave-backward-compatibility-check'

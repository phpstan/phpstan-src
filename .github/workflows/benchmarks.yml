name: "Benchmarks"

on:
  pull_request:
    paths:
      - 'src/**'
      - 'conf/**'
      - 'stubs/**'
      - 'composer.lock'
      - 'tests/bench/**'
      - '.github/workflows/benchmarks.yml'
  push:
    branches:
      - "2.3.x"
    paths:
      - 'src/**'
      - 'conf/**'
      - 'stubs/**'
      - 'composer.lock'
      - 'tests/bench/**'
      - '.github/workflows/benchmarks.yml'

concurrency:
  group: benchmarks-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CODSPEED_VERSION: "5.6.3"
  # of codspeed-runner-x86_64-unknown-linux-musl.tar.gz in that release
  CODSPEED_SHA256: "f29532a5cbcb3462bc5d6bcf5570ddb8c8cbfffed579cb48c35d3910ed5f7f00"
  # tests/bench/measure.php calls it over FFI to measure only the analysis of the benchmark
  INSTRUMENT_HOOKS_COMMIT: "8fd5b878499f819561b33219cdafaa6f8c28b4e4"

jobs:
  run:
    name: "Benchmarks shard ${{ matrix.shard }}"
    # Pinned because the instruction counts depend on the PHP build and the system libraries
    runs-on: ubuntu-24.04
    # The slowest shard takes about 20 minutes, and run.php stops a benchmark after 25
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        # Each shard is one runner, see tests/bench/shard.php
        shard: [1, 2, 3, 4]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
        with:
          coverage: "none"
          php-version: "8.5"
          extensions: ds,ffi,mbstring
          ini-file: production
          ini-values: memory_limit=-1

      - uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # v4.0.0

      - name: "Install CodSpeed"
        run: |
          mkdir -p "$RUNNER_TEMP/codspeed"
          cd "$RUNNER_TEMP/codspeed"
          curl -fsSLO "https://github.com/CodSpeedHQ/codspeed/releases/download/v${CODSPEED_VERSION}/codspeed-runner-x86_64-unknown-linux-musl.tar.gz"
          echo "${CODSPEED_SHA256}  codspeed-runner-x86_64-unknown-linux-musl.tar.gz" | sha256sum -c -
          tar xzf codspeed-runner-x86_64-unknown-linux-musl.tar.gz --strip-components=1 codspeed-runner-x86_64-unknown-linux-musl/codspeed
          echo "$RUNNER_TEMP/codspeed" >> "$GITHUB_PATH"
          ./codspeed setup --mode=simulation

      - name: "Build CodSpeed's instrument-hooks"
        run: |
          git init -q "$RUNNER_TEMP/instrument-hooks"
          cd "$RUNNER_TEMP/instrument-hooks"
          git fetch -q --depth=1 https://github.com/CodSpeedHQ/instrument-hooks.git "$INSTRUMENT_HOOKS_COMMIT"
          git checkout -q FETCH_HEAD
          gcc -shared -fPIC -O2 -Iincludes -w dist/core.c -o libinstrument_hooks.so

      - name: "Run benchmarks"
        env:
          INSTRUMENT_HOOKS_LIBRARY: ${{ runner.temp }}/instrument-hooks/libinstrument_hooks.so
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        # Valgrind runs each benchmark on one CPU, so the shard runs as many at once as the runner has
        run: |
          mkdir -p tmp/bench-results
          php tests/bench/shard.php "$SHARDS" "$SHARD" | xargs -P "$(nproc)" -I {} php tests/bench/run.php "tests/bench/data/{}" "tmp/bench-results/{}.neon"

      - name: "Upload results"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results-${{ matrix.shard }}
          path: tmp/bench-results/*.neon
          if-no-files-found: ignore

  compare:
    name: "Compare with expected.neon"
    needs: run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
        with:
          coverage: "none"
          php-version: "8.5"

      - uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # v4.0.0

      - name: "Download results"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: benchmark-results-*
          merge-multiple: true
          path: tmp/bench-results

      - name: "Compare"
        run: "php tests/bench/compare.php tmp/bench-results tmp/expected.neon"

      - name: "Upload measured metrics"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-measured
          path: tmp/expected.neon

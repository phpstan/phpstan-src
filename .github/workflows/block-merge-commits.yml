on: pull_request

name: Block merge commits

concurrency:
  group: block-merge-commits-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: read # Block Merge Commits lists the pull request's commits

jobs:
  message-check:
    name: Block Merge Commits

    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Block Merge Commits
        uses: Morishiri/block-merge-commits-action@a4554c78def8d874966a8d1e20e2971121443755 # v1.0.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

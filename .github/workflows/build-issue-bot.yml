# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Build Issue Bot"

on:
  pull_request:
    paths:
      - 'issue-bot/**'
      - '.github/workflows/build-issue-bot.yml'
  push:
    branches:
      - "2.3.x"
    paths:
      - 'issue-bot/**'
      - '.github/workflows/build-issue-bot.yml'

concurrency:
  group: build-issue-bot-${{ github.head_ref || github.run_id }} # will be canceled on subsequent pushes in pull requests but not branches
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-issue-bot:
    name: "Build Issue Bot"

    runs-on: "ubuntu-latest"
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        script:
          - "../bin/phpstan"
          - "vendor/bin/phpunit"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
        with:
          coverage: "none"
          php-version: "8.5"

      - uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # v4.0.0

      - name: "Install issue-bot dependencies"
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # v4.0.0
        with:
          working-directory: "issue-bot"

      - name: "Tests"
        working-directory: "issue-bot"
        run: ${{ matrix.script }}

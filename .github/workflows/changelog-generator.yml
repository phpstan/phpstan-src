# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Build Changelog Generator"

on:
  pull_request:
    paths:
      - 'changelog-generator/**'
      - '.github/workflows/changelog-generator.yml'
  push:
    branches:
      - "2.1.x"
    paths:
      - 'changelog-generator/**'
      - '.github/workflows/changelog-generator.yml'

concurrency:
  group: changelog-${{ github.head_ref || github.run_id }} # will be canceled on subsequent pushes in pull requests but not branches
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changelog-generator:
    name: "Build Changelog Generator"

    runs-on: "ubuntu-latest"
    timeout-minutes: 60

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: "Install PHP"
        uses: "shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1" # v2
        with:
          coverage: "none"
          php-version: "8.2"

      - uses: "ramsey/composer-install@3cf229dc2919194e9e36783941438d17239e8520" # v3

      - name: "Install Changelog Generator dependencies"
        uses: "ramsey/composer-install@3cf229dc2919194e9e36783941438d17239e8520" # v3
        with:
          working-directory: "changelog-generator"

      - name: "PHPStan"
        working-directory: "changelog-generator"
        run: "../bin/phpstan"

name: "Claude Easy Fixes"

on:
  workflow_dispatch:
    inputs:
      issue_count:
        description: "Number of issues to pick and fix in parallel"
        required: false
        default: "1"
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  pick-issues:
    name: "Pick easy fix issues"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      matrix: ${{ steps.pick-issues.outputs.matrix }}

    steps:
      - name: "Pick random Easy fix issues"
        id: pick-issues
        env:
          GH_TOKEN: ${{ secrets.PHPSTAN_BOT_TOKEN }}
          ISSUE_COUNT: ${{ inputs.issue_count || '1' }}
        run: |
          ISSUE_JSON=$(gh issue list \
            --repo phpstan/phpstan \
            --milestone "Easy fixes" \
            --state open \
            --json number,title,body,url \
            --limit 100 \
          )

          TOTAL=$(echo "$ISSUE_JSON" | jq 'length')
          if [ "$TOTAL" -eq 0 ]; then
            echo "No issues found in Easy fixes milestone"
            exit 1
          fi

          COUNT=$ISSUE_COUNT
          if [ "$COUNT" -gt "$TOTAL" ]; then
            COUNT=$TOTAL
          fi

          # Pick COUNT random unique issues
          SELECTED=$(echo "$ISSUE_JSON" | python3 -c "
          import json, sys, random
          issues = json.load(sys.stdin)
          random.shuffle(issues)
          count = min(int('$COUNT'), len(issues))
          print(json.dumps(issues[:count]))
          ")

          echo "Selected $COUNT issue(s) for fixing"

          # Build matrix JSON - each entry has issue details
          # We need to fetch full body for each issue separately since list may truncate
          MATRIX="[]"
          for NUMBER in $(echo "$SELECTED" | jq -r '.[].number'); do
            TITLE=$(echo "$SELECTED" | jq -r --argjson n "$NUMBER" '.[] | select(.number == $n) | .title')
            URL=$(echo "$SELECTED" | jq -r --argjson n "$NUMBER" '.[] | select(.number == $n) | .url')

            BODY=$(gh issue view "$NUMBER" \
              --repo phpstan/phpstan \
              --json body \
              --jq '.body')

            # Base64 encode the body to safely pass through JSON matrix
            BODY_B64=$(echo "$BODY" | base64 -w 0)

            MATRIX=$(echo "$MATRIX" | jq -c \
              --argjson number "$NUMBER" \
              --arg title "$TITLE" \
              --arg url "$URL" \
              --arg body_b64 "$BODY_B64" \
              '. + [{number: $number, title: $title, url: $url, body_b64: $body_b64}]')

            echo "### Selected issue: #$NUMBER - $TITLE" >> "$GITHUB_STEP_SUMMARY"
            echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "matrix=$(echo "$MATRIX" | jq -c '.')" >> "$GITHUB_OUTPUT"

  easy-fix:
    name: "Fix #${{ matrix.issue.number }}: ${{ matrix.issue.title }}"
    needs: pick-issues
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        issue: ${{ fromJson(needs.pick-issues.outputs.matrix) }}

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          ref: "2.1.x"
          fetch-depth: 0
          token: ${{ secrets.PHPSTAN_BOT_TOKEN }}

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: "none"
          php-version: "8.4"
          ini-file: development
          extensions: mbstring

      - uses: "ramsey/composer-install@v3"

      - name: "Install Claude Code"
        run: npm install -g @anthropic-ai/claude-code

      - name: "Build prompt"
        env:
          ISSUE_NUMBER: ${{ matrix.issue.number }}
          ISSUE_TITLE: ${{ matrix.issue.title }}
          ISSUE_URL: ${{ matrix.issue.url }}
          ISSUE_BODY_B64: ${{ matrix.issue.body_b64 }}
        run: |
          python3 << 'PYEOF'
          import os
          import base64

          n = os.environ["ISSUE_NUMBER"]
          title = os.environ["ISSUE_TITLE"]
          url = os.environ["ISSUE_URL"]
          body = base64.b64decode(os.environ["ISSUE_BODY_B64"]).decode("utf-8")

          prompt = f"""You are working on phpstan/phpstan-src, the source code of PHPStan - a PHP static analysis tool.

          Your task is to fix the following GitHub issue from the phpstan/phpstan repository:
          Issue #{n}: {title}
          URL: {url}

          Issue body:
          {body}

          ## Step 1: Retrieve playground code

          From the issue body above, find any referenced PHPStan playground links (URLs matching https://phpstan.org/r/<UUID>).

          For each playground link, extract the UUID and fetch the code and analysis results using the API:
          curl https://api.phpstan.org/sample?id=<UUID>

          The API returns JSON with:
          - code: The PHP code that was analyzed
          - level: The PHPStan rule level
          - config.strictRules: Whether strict rules are enabled
          - config.bleedingEdge: Whether bleeding edge is enabled
          - config.treatPhpDocTypesAsCertain: PHPDoc type certainty setting
          - versionedErrors: Array of {{phpVersion, errors: [{{line, message, identifier}}]}}

          ## Step 2: Write a regression test

          Based on the issue and the playground code:

          - If the problem is only about type inference (wrong type reported, missing type narrowing, etc.), add a test file in tests/PHPStan/Analyser/nsrt/ using assertType() and assertNativeType() calls. Name it bug-{n}.php. Look at existing files in that directory for examples.

          - If the problem is about a rule false positive/negative (wrong error reported or missing error), add a rule-specific test. Find the relevant rule test case in tests/PHPStan/Rules/ and add a test data file. Look at existing bug test files in those directories for the pattern.

          The regression test should fail without the fix - verify this by running it before implementing the fix.

          Run individual test files with: php vendor/bin/phpunit <test-file>
          Run all tests with: make tests
          Run PHPStan with: make phpstan

          ## Step 3: Fix the bug

          Implement the fix in the source code under src/. Common areas to look:
          - src/Analyser/NodeScopeResolver.php - AST traversal and scope management
          - src/Analyser/MutatingScope.php - Type tracking
          - src/Analyser/TypeSpecifier.php - Type narrowing from conditions
          - src/Type/ - Type system implementations
          - src/Rules/ - Rule implementations
          - src/Reflection/ - Reflection layer

          Read CLAUDE.md for important guidelines about the codebase architecture and common patterns.

          ## Step 4: Verify the fix

          1. Run the regression test to confirm it passes now
          2. Run the full test suite: make tests
          3. Run PHPStan self-analysis: make phpstan
          4. Fix any failures that come up

          Do not create a branch, push, or create a PR - this will be handled automatically.
          """

          with open("/tmp/claude-prompt.txt", "w") as f:
              f.write(prompt)
          PYEOF

      - name: "Run Claude Code"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.PHPSTAN_BOT_TOKEN }}
        run: |
          git config user.name "phpstan-bot"
          git config user.email "ondrej+phpstanbot@mirtes.cz"

          claude -p \
            --model claude-opus-4-6 \
            --output-format stream-json \
            --verbose \
            --dangerously-skip-permissions \
            "$(cat /tmp/claude-prompt.txt)"

      - name: "Create Pull Request"
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PHPSTAN_BOT_TOKEN }}
          branch-suffix: random
          delete-branch: true
          title: "Fix #${{ matrix.issue.number }}: ${{ matrix.issue.title }}"
          body: "Fixes phpstan/phpstan#${{ matrix.issue.number }}"
          committer: "phpstan-bot <ondrej+phpstanbot@mirtes.cz>"
          commit-message: "Fix #${{ matrix.issue.number }}"

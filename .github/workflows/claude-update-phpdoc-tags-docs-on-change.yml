name: "Claude Update PHPDoc Tags Docs On Change"

on:
  push:
    branches:
      - "2.3.x"
    paths:
      - '.github/workflows/claude-update-phpdoc-tags-docs-on-change.yml'
      - 'src/PhpDoc/PhpDocNodeResolver.php'

# The job only dispatches a workflow in phpstan-bot/phpstan-src with
# PHPSTAN_BOT_TOKEN; it does not use the workflow token.
permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  fix:
    name: "Update PHPDoc Tags Docs"
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Trigger Claude Update PHPDoc Tags Docs
        env:
          GH_TOKEN: ${{ secrets.PHPSTAN_BOT_TOKEN }}
        run: gh workflow run claude-update-phpdoc-tags-docs.yml --repo phpstan-bot/phpstan-src

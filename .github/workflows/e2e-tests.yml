# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "E2E Tests"

on:
  pull_request:
    paths-ignore:
      - 'compiler/**'
      - 'apigen/**'
      - 'changelog-generator/**'
      - 'issue-bot/**'
  push:
    branches:
      - "2.3.x"
    paths-ignore:
      - 'compiler/**'
      - 'apigen/**'
      - 'changelog-generator/**'
      - 'issue-bot/**'

concurrency:
  group: e2e-${{ github.head_ref || github.run_id }} # will be canceled on subsequent pushes in pull requests but not branches
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  result-cache-e2e-tests:
    name: "Result cache E2E tests (${{ matrix.shard }}/4)"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
        with:
          coverage: "none"
          php-version: "8.2"
          extensions: mbstring
          ini-values: memory_limit=256M

      - uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # v4.0.0

      - name: "Patch PHPStan"
        run: "patch src/Analyser/Error.php < e2e/PHPStanErrorPatch.patch"

      - name: "Install bashunit"
        uses: "TypedDevs/bashunit@8d4f357f52df7596f92ece2d6c049d91d45517a2" # 0.52.0
        with:
          directory: "e2e"

      - name: "Test"
        env:
          SHARD: ${{ matrix.shard }}
        run: e2e/bashunit test e2e --tag 'result-cache&&!windows' --shard "$SHARD/4"

  result-cache-e2e-tests-windows:
    name: "Result cache E2E tests on Windows"
    # https://github.com/phpstan/phpstan/issues/15152: since 2.2.9 the result cache stores its
    # paths relative to the PHPStan install, and on Windows it is reported to be discarded on
    # every run ("metadata do not match: ... executedFilesHashes"). Each scenario analyses an
    # unchanged project twice and asserts the warm run restores the cache.
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
        with:
          coverage: "none"
          php-version: "8.2"
          extensions: mbstring
          ini-values: memory_limit=256M

      - uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # v4.0.0

      - name: "Install bashunit"
        uses: "TypedDevs/bashunit@8d4f357f52df7596f92ece2d6c049d91d45517a2" # 0.52.0
        with:
          directory: "e2e"

      - name: "Test"
        run: "e2e/bashunit test e2e --tag windows"

  e2e-tests:
    name: "E2E tests"
    runs-on: "ubuntu-latest"
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - script: "e2e/bashunit test e2e --tag '!result-cache&&!own-setup' --shard 1/2"
          - script: "e2e/bashunit test e2e --tag '!result-cache&&!own-setup' --shard 2/2"
          # The tests tagged own-setup, each needing a PHP setup or runner of its own
          - script: "e2e/bashunit test e2e/repository-root/repository-root_test.sh::test_timecop"
            tools: "pecl"
            extensions: "timecop-beta"
          - script: "e2e/bashunit test e2e/repository-root/repository-root_test.sh::test_soap_with_extension"
            extensions: "soap"
          - script: "e2e/bashunit test e2e/repository-root/repository-root_test.sh::test_curl_setopt_without_curl"
            extensions: ":curl"
          - script: "e2e/bashunit test e2e/bug-11359/bug-11359_test.sh::test_mb_ucfirst_not_found_on_php_8_2"
            php-version: "8.2"
            extensions: "mbstring"
          - script: "e2e/bashunit test e2e/bug-11359/bug-11359_test.sh::test_mb_ucfirst_found_on_php_8_4"
            php-version: "8.4"
            extensions: "mbstring"
          - script: "e2e/bashunit test e2e/bug-15407/bug-15407_test.sh::test_pcov_loaded_restarts"
            coverage: "pcov"
          - script: "e2e/bashunit test e2e/bug-15407/bug-15407_test.sh::test_pcov_enabled_restarts"
            coverage: "pcov"
            ini-values: "pcov.enabled=1"
          - script: "e2e/bashunit test e2e/bug-15407/bug-15407_test.sh::test_pcov_disabled_does_not_restart_for_pcov"
            coverage: "pcov"
            ini-values: "pcov.enabled=0"
          - script: "e2e/bashunit test e2e/repository-root/repository-root_test.sh::test_glibc_with_musl_loader_picks_glibc_turbo_build"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
        with:
          coverage: ${{ matrix.coverage || 'none' }}
          ini-values: ${{ matrix.ini-values || '' }}
          php-version: ${{ matrix.php-version || '8.2' }}
          tools: ${{ matrix.tools }}
          extensions: ${{ matrix.extensions }}

      - uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # v4.0.0

      - name: "Install bashunit"
        uses: "TypedDevs/bashunit@8d4f357f52df7596f92ece2d6c049d91d45517a2" # 0.52.0
        with:
          directory: "e2e"

      - name: "Test"
        env:
          MATRIX_SCRIPT: ${{ matrix.script }}
        run: eval "$MATRIX_SCRIPT"

  turbo-arena-e2e-tests:
    name: "Turbo arena E2E tests"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the extension bakes its version from `git log -- turbo-ext/src`, and
          # TurboExtensionEnabler activates only the expected version - a shallow
          # clone hands us a "dev" build, which would skip the whole test
          fetch-depth: 0

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
        with:
          coverage: "none"
          php-version: "8.5"

      - uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # v4.0.0

      - name: "Install bashunit"
        uses: "TypedDevs/bashunit@8d4f357f52df7596f92ece2d6c049d91d45517a2" # 0.52.0
        with:
          directory: "e2e"

      - name: "Build the turbo extension"
        run: make build-turbo

      - name: "Load the turbo extension through php.ini"
        # the restart re-executes the process with the loaded ini files to
        # activate OPcache; an extension passed as -d would not survive that,
        # one from the ini scan dir is loaded again
        run: |
          echo "extension=$PWD/turbo-ext/phpstan_turbo.so" | sudo tee "$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')/99-phpstan-turbo.ini"
          php -r 'exit(extension_loaded("phpstan_turbo") ? 0 : 1);'

      - name: "Verify the arena is actually exercised"
        # Without an active extension ArenaCache is the no-op PHP twin and no
        # shared memory exists at all; without fork the workers do not publish in
        # lockstep. Either would make the test below pass for the wrong reason.
        run: |
          OUTPUT=$(php bin/phpstan diagnose -c e2e/turbo-arena/phpstan.neon)
          echo "$OUTPUT"
          e2e/bashunit assert contains 'Turbo extension: enabled' "$OUTPUT"
          e2e/bashunit assert contains 'Mechanism:                 fork (pcntl_fork)' "$OUTPUT"

      - name: "Verify PHPSTAN_TURBO=0 does not disable the extension"
        # The env var was an escape hatch that users kept in their scripts long
        # after whatever it worked around got fixed. A loaded, version-matching
        # extension is now always used, so the variable has to be inert -
        # https://github.com/phpstan/phpstan/issues/15143
        run: |
          OUTPUT=$(PHPSTAN_TURBO=0 php bin/phpstan diagnose -c e2e/turbo-arena/phpstan.neon)
          echo "$OUTPUT"
          e2e/bashunit assert contains 'Turbo extension: enabled' "$OUTPUT"

      - name: "Verify conditional types leave interned types equal to a resolved subject alone"
        # With the extension active TypeCombinator's results are interned, so equal
        # types share one instance. ConditionalType used to narrow the types in its
        # branches identical to the subject even once the subject had resolved to a
        # concrete type, and interning made that hit unrelated types - the `mixed`
        # value type of an `array` branch for a `mixed` subject -
        # https://github.com/phpstan/phpstan/issues/15151
        run: |
          cd e2e/bug-15151
          OUTPUT=$(php ../../bin/phpstan analyse --no-progress --error-format=raw 2>&1 || true)
          echo "$OUTPUT"
          ../bashunit assert contains 'reception_formulaire.php:20:Dumped type: mixed' "$OUTPUT"
          ../bashunit assert contains 'webservice.php:25:Dumped type: mixed' "$OUTPUT"
          ../bashunit assert not_contains 'Dumped type: array' "$OUTPUT"
          # the two dumps are the only errors: count the file:line:message lines
          ../bashunit assert equals '2' "$(echo "$OUTPUT" | grep -Ec '^/.+:[0-9]+:')"

      - name: "Verify conditional types leave memoized types equal to the argument alone"
        # With the extension active TypeCombinator's results are memoized, so every
        # `int|false` resolved from a PHPDoc is the same object. ConditionalType
        # narrowed the types in its branches identical to the argument, which made
        # `($priority is int ? bool : int|false)` lose the `int` for an `int|false`
        # argument - https://github.com/phpstan/phpstan/issues/15268
        run: |
          cd e2e/bug-15268
          php ../../bin/phpstan analyse --no-progress --error-format=raw

      - name: "Verify name scopes built from the simplified AST are not reused for an analysed file"
        # A run on other paths builds the name scopes of the scanned file from its
        # simplified AST, without the anonymous class declared in a function body.
        # A later full run must not reuse them, even with the result cache cleared -
        # https://github.com/phpstan/phpstan/issues/15475
        run: |
          cd e2e/bug-15475
          php ../../bin/phpstan analyse --no-progress src/usage.php
          php ../../bin/phpstan clear-result-cache
          php ../../bin/phpstan analyse --no-progress

      - name: "Test"
        # The arena is a per-run POSIX shared-memory object: shm_open() plus an
        # ftruncate() to 256 MB that tmpfs honours sparsely, committing pages on
        # first touch. When the backing store cannot commit one, the worker that
        # touches it takes SIGBUS and dies where it stands. 64 MB is what docker
        # gives /dev/shm by default, which is how
        # https://github.com/phpstan/phpstan/issues/15131 reached users; 32 MB
        # makes it deterministic on a 4-core runner. Running out of shared memory
        # must cost sharing, never results - the analysis has to come out exactly
        # as it does with the runner's normal /dev/shm.
        run: |
          cd e2e/turbo-arena
          rm -rf tmp
          php ../../bin/phpstan analyse --no-progress > "$RUNNER_TEMP/reference.txt" 2>&1 || true
          tail -5 "$RUNNER_TEMP/reference.txt"
          # a warm disk cache is the worst case: every worker loads and publishes
          # the same entries at the same moment, so duplicates pile up fastest
          php ../../bin/phpstan clear-result-cache
          sudo mount -o remount,size=32M /dev/shm
          df -h /dev/shm
          php ../../bin/phpstan analyse --no-progress > "$RUNNER_TEMP/small-shm.txt" 2>&1 || true
          tail -40 "$RUNNER_TEMP/small-shm.txt"
          # bashunit takes the haystack as a single argv entry, and execve caps
          # one argument at 128 KB - a few hundred KB of analysis output only
          # fits through the assertion once grep has narrowed it down
          ../bashunit assert not_contains 'parallel worker' "$(grep -F 'parallel worker' "$RUNNER_TEMP/small-shm.txt" || true)"
          diff "$RUNNER_TEMP/reference.txt" "$RUNNER_TEMP/small-shm.txt"

  turbo-fork-unsafe-extension-e2e-tests:
    name: "Turbo fork-unsafe extension E2E tests"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the extension bakes its version from `git log -- turbo-ext/src`, and
          # TurboExtensionEnabler activates only the expected version - a shallow
          # clone hands us a "dev" build, which would skip the whole test
          fetch-depth: 0

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
        with:
          coverage: "none"
          php-version: "8.5"

      - uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # v4.0.0

      - name: "Install bashunit"
        uses: "TypedDevs/bashunit@8d4f357f52df7596f92ece2d6c049d91d45517a2" # 0.52.0
        with:
          directory: "e2e"

      - name: "Build the turbo extension"
        run: make build-turbo

      - name: "Build the fork-unsafe extension"
        # a model of ext-grpc without grpc.enable_fork_support: its module
        # shutdown waits for a thread that a forked child never has. phpize
        # builds in place, so a copy keeps the build tree out of the checkout.
        run: |
          cp -r e2e/fork-unsafe-extension/ext "$RUNNER_TEMP/forkunsafe"
          cd "$RUNNER_TEMP/forkunsafe"
          phpize
          ./configure
          make -j"$(nproc)"

      - name: "Load both extensions through php.ini"
        # the restart re-executes the process with the loaded ini files to
        # activate OPcache; extensions passed as -d would not survive that,
        # ones from the ini scan dir are loaded again
        run: |
          printf 'extension=%s\nextension=%s\n' "$PWD/turbo-ext/phpstan_turbo.so" "$RUNNER_TEMP/forkunsafe/modules/forkunsafe.so" | sudo tee "$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')/99-phpstan-turbo.ini"
          php -r 'exit(extension_loaded("phpstan_turbo") && extension_loaded("forkunsafe") ? 0 : 1);'

      - name: "Verify the extension wedges a forked child on its own"
        # a plain exit() in a forked child must hang, or the test below would
        # pass for the wrong reason
        run: |
          set +e
          timeout 10 php e2e/fork-unsafe-extension/fork-and-exit.php
          CODE=$?
          set -e
          e2e/bashunit assert equals "124" "$CODE"

      - name: "Verify fork mode is actually used"
        run: |
          OUTPUT=$(php bin/phpstan diagnose -c e2e/fork-unsafe-extension/phpstan.neon)
          echo "$OUTPUT"
          e2e/bashunit assert contains 'Turbo extension: enabled' "$OUTPUT"
          e2e/bashunit assert contains 'Mechanism:                 fork (pcntl_fork)' "$OUTPUT"

      - name: "Test"
        # https://github.com/phpstan/phpstan/issues/15138 - the forked worker
        # delivers its result (100%) and then hangs in the inherited extension's
        # module shutdown; the run must finish instead
        run: |
          cd e2e/fork-unsafe-extension
          rm -rf tmp
          OUTPUT=$(../bashunit assert exit_code "0" "timeout 120 php ../../bin/phpstan analyse --no-progress -vvv")
          echo "$OUTPUT"
          ../bashunit assert contains 'Mechanism:                 fork (pcntl_fork)' "$OUTPUT"
          ../bashunit assert contains '[OK] No errors' "$OUTPUT"

  process-restart-e2e-tests:
    name: "Process restart E2E tests"
    runs-on: ${{ matrix.operating-system }}
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          # pcov armed: one restart, every process - the forked worker
          # included, which no per-worker `-d` injection could reach - runs
          # disarmed. pcov stays loaded: the rows disarm rather than unload,
          # which keeps the extension's own symbols reflectable. setup-php
          # loads OPcache dormant on CLI, so the same restart activates it in
          # every Linux row
          - operating-system: "ubuntu-latest"
            coverage: "pcov"
            extensions: ""
            script: |
              php ../../bin/phpstan analyse --no-progress
              php check.php restarted-for=pcov,opcache pcov-armed=no pcov-loaded=yes opcache-cli-on=yes processes=2+ starts=2

          # Windows has no pcntl_exec, so the restart runs as a child process
          # whose exit code is passed on. OPcache is left alone there: the
          # workers are spawned, and ProcessHelper activates it for each
          - operating-system: "windows-latest"
            coverage: "pcov"
            extensions: ""
            script: |
              php ../../bin/phpstan analyse --no-progress
              php check.php restarted-for=pcov pcov-armed=no processes=1+ starts=2
              set +e
              php ../../bin/phpstan analyse --no-progress --configuration failing.neon
              EXIT_CODE=$?
              set -e
              if [ "$EXIT_CODE" != "1" ]; then
                echo "FAIL: the restarted process' exit code was not passed on, got $EXIT_CODE"
                exit 1
              fi

          # xdebug: one restart disarms it via xdebug.mode=off, and it stays
          # loaded so xdebug_*() remains reflectable. No note about it being
          # active either
          - operating-system: "ubuntu-latest"
            coverage: "xdebug"
            extensions: ""
            script: |
              php ../../bin/phpstan analyse --no-progress 2>&1 | tee out.txt
              if grep -q 'The Xdebug PHP extension is active, but' out.txt; then
                echo "FAIL: xdebug survived the restart armed"
                exit 1
              fi
              php check.php restarted-for=xdebug,opcache xdebug-armed=no xdebug-loaded=yes processes=2+ starts=2

          # xdebug armed in php.ini, disarmed with `php -d xdebug.mode=off`:
          # nothing to restart for, and the spawned workers do not inherit the
          # -d flag - ProcessHelper has to pass the switch on, or they run with
          # the php.ini's xdebug.mode
          - operating-system: "windows-latest"
            coverage: "xdebug"
            extensions: ""
            script: |
              php -d xdebug.mode=off ../../bin/phpstan analyse --no-progress
              php check.php restarted-for= xdebug-armed=no xdebug-loaded=yes processes=2+ starts=1

          # XDEBUG_MODE overrides xdebug.mode, so flagging the ini alone would
          # be silently overridable - the row exports the env var too
          - operating-system: "ubuntu-latest"
            coverage: "xdebug"
            extensions: ""
            script: |
              XDEBUG_MODE=develop,debug php ../../bin/phpstan analyse --no-progress
              php check.php restarted-for=xdebug,opcache xdebug-armed=no xdebug-loaded=yes processes=2+ starts=2

          # --xdebug keeps xdebug armed and does not restart for it - only for
          # OPcache
          - operating-system: "ubuntu-latest"
            coverage: "xdebug"
            extensions: ""
            script: |
              php ../../bin/phpstan analyse --no-progress --xdebug 2>&1 | tee out.txt
              if ! grep -q 'enabled, and the Xdebug PHP extension is active' out.txt; then
                echo "FAIL: --xdebug did not keep xdebug"
                exit 1
              fi
              php check.php restarted-for=opcache xdebug-armed=yes processes=1+ starts=2

          # xdebug and pcov together: one restart handles both. Both come in
          # through `extensions` because setup-php's `coverage: xdebug` unloads
          # pcov. xdebug is armed by its default mode, pcov on the command
          # line - which also proves the composed ini carries runtime `-d`
          # overrides over without reconstructing them from $argv
          - operating-system: "ubuntu-latest"
            coverage: ""
            extensions: "xdebug, pcov"
            script: |
              php -d pcov.enabled=1 ../../bin/phpstan analyse --no-progress
              php check.php restarted-for=xdebug,pcov,opcache pcov-armed=no xdebug-armed=no processes=2+ starts=2

          # --xdebug with pcov armed: xdebug stays armed, pcov is still
          # disarmed by the same restart - something xdebug-handler could never
          # express
          - operating-system: "ubuntu-latest"
            coverage: ""
            extensions: "xdebug, pcov"
            script: |
              php -d pcov.enabled=1 ../../bin/phpstan analyse --no-progress --xdebug
              php check.php restarted-for=pcov,opcache pcov-armed=no xdebug-armed=yes processes=1+ starts=2

          # uopz rewrites opcodes unless uopz.disable=1
          - operating-system: "ubuntu-latest"
            coverage: "none"
            extensions: "uopz"
            script: |
              php ../../bin/phpstan analyse --no-progress
              php check.php restarted-for=uopz,opcache uopz-armed=no processes=2+ starts=2

          # OPcache is dormant on CLI by default - the restart activates it,
          # and the forked workers inherit the parent's warm opcode cache
          - operating-system: "ubuntu-latest"
            coverage: "none"
            extensions: "opcache"
            script: |
              php -d opcache.enable_cli=0 ../../bin/phpstan analyse --no-progress -vvv > out.txt 2>&1
              cat out.txt
              php check.php restarted-for=opcache opcache-cli-on=yes processes=2+ starts=2
              if ! grep -qE 'Mechanism: +fork' out.txt; then
                echo "FAIL: the workers were not forked under the activated OPcache"
                exit 1
              fi

          # a PHP process spawned during the run - by an extension compiling
          # its own DI container, say - reads the composed ini through PHPRC,
          # so a forked worker that ends must not delete it; the rule spawns
          # one in the main process after every worker has ended
          - operating-system: "ubuntu-latest"
            coverage: "pcov"
            extensions: ""
            script: |
              set +e
              php ../../bin/phpstan analyse -c spawn.neon -a SpawnedProcessRule.php --no-progress --error-format=raw -vvv > out.txt 2>&1
              CODE=$?
              set -e
              cat out.txt
              if ! grep -qE 'Mechanism: +fork' out.txt; then
                echo "FAIL: the workers were not forked"
                exit 1
              fi
              if [ "$CODE" != "0" ]; then
                echo "FAIL: the analysis exited with $CODE"
                exit 1
              fi
              php check.php restarted-for=pcov,opcache pcov-armed=no processes=2+ starts=2

          # --debug restarts like any other run - it only makes the analysis
          # serial, --xdebug is what keeps xdebug
          - operating-system: "ubuntu-latest"
            coverage: "pcov"
            extensions: ""
            script: |
              php ../../bin/phpstan analyse --no-progress --debug
              php check.php restarted-for=pcov,opcache pcov-armed=no processes=1 starts=2

          # diagnose never restarts either, it reports what a run would do
          - operating-system: "ubuntu-latest"
            coverage: "pcov"
            extensions: ""
            script: |
              php ../../bin/phpstan diagnose 2>&1 | tee out.txt
              if ! grep -qE 'Restart if started now: +yes - pcov' out.txt; then
                echo "FAIL: diagnose did not report the restart it would perform"
                exit 1
              fi

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
        with:
          coverage: ${{ matrix.coverage }}
          php-version: "8.2"
          extensions: ${{ matrix.extensions }}

      - uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # v4.0.0

      - name: "Test"
        working-directory: "e2e/restart-manager"
        env:
          SCRIPT: ${{ matrix.script }}
          # Symfony wraps its notes to the terminal width and prefixes wrapped
          # lines with "!", which can split a phrase in a way no post-processing
          # rejoins - and would make the negative assertions pass vacuously
          COLUMNS: "400"
        run: |
          # count every start of the main process, the one before the restart
          # included - which only an ini-level hook sees
          LINE=$(php -r 'echo "auto_prepend_file=\"", getcwd(), DIRECTORY_SEPARATOR, "start-log.php\"";')
          INI=$(php -r 'echo php_ini_loaded_file();')
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$LINE" >> "$INI"
          else
            echo "$LINE" | sudo tee -a "$INI" > /dev/null
          fi
          php ../../bin/phpstan clear-result-cache
          rm -f probe.log starts.log
          eval "$SCRIPT"

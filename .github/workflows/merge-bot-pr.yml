# https://help.github.com/en/categories/automating-your-workflow-with-github-actions
# https://github.com/WyriHaximus/github-action-wait-for-status

name: Merge bot PR
on:
  pull_request:
    types:
      - opened
jobs:
  automerge:
    name: Automerge PRs
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: 'Wait for status checks'
        if: github.event.pull_request.user.login == 'phpstan-bot'
        id: waitforstatuschecks
        uses: "WyriHaximus/github-action-wait-for-status@c638eadb55e7c6d951b0eb5fff5733569d82b03e" # v1.8
        with:
          ignoreActions: "automerge,Automerge PRs"
          checkInterval: 13
        env:
          GITHUB_TOKEN: "${{ secrets.PHPSTAN_BOT_TOKEN }}"
      - name: Merge Pull Request
        uses: juliangruber/merge-pull-request-action@8325c6102b479a25200b2ecbede066b1ac3e2feb # v1.4.0
        if: steps.waitforstatuschecks.outputs.status == 'success'
        with:
          github-token: "${{ secrets.PHPSTAN_BOT_TOKEN }}"
          number: "${{ github.event.number }}"
          method: rebase

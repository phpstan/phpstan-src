# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Build Turbo compile images"

# Builds .github/turbo-build/Dockerfile natively on x86_64 and arm64
# runners and publishes ghcr.io/phpstan/turbo-build:gnu-php{8.3,8.4,8.5}
# as multi-arch manifests. The turbo-compile gnu legs in phar.yml run in
# these images, so their only network dependency is a GHCR pull — no apt,
# no ports.ubuntu.com, no PPA at compile time.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/turbo-build/**"
      - ".github/workflows/turbo-build-image.yml"
  push:
    branches:
      - "2.2.x"
    paths:
      - ".github/turbo-build/**"
      - ".github/workflows/turbo-build-image.yml"
  schedule:
    # weekly rebuild so PHP patch releases and security updates flow into
    # the baked images — the compile jobs never run apt themselves
    - cron: '30 2 * * 1'

permissions:
  contents: read

concurrency:
  group: turbo-build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: "Build image (php${{ matrix.php-version }}, ${{ matrix.platform.arch }})"
    if: github.repository == 'phpstan/phpstan-src'
    runs-on: ${{ matrix.platform.runs-on }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.3", "8.4", "8.5"]
        platform:
          - arch: "amd64"
            runs-on: "ubuntu-latest"
          - arch: "arm64"
            runs-on: "ubuntu-24.04-arm"

    env:
      IMAGE: "ghcr.io/phpstan/turbo-build:gnu-php${{ matrix.php-version }}-${{ matrix.platform.arch }}"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: "Build"
        run: docker build --build-arg "PHP_MINOR=${{ matrix.php-version }}" -t "$IMAGE" .github/turbo-build

      - name: "Smoke test (interpreter matches the matrix, toolchain present)"
        run: |
          VERSION="$(docker run --rm "$IMAGE" php -r 'echo PHP_VERSION;')"
          echo "image reports PHP $VERSION, expected ${{ matrix.php-version }}.*"
          [ "${VERSION%.*}" = "${{ matrix.php-version }}" ]
          docker run --rm "$IMAGE" sh -c 'php-config --version && git --version && g++ --version && make --version && curl --version'

      # PR runs stop here: build + smoke validate the Dockerfile change,
      # only pushes to 2.2.x (and the cron/manual runs) publish.
      - name: "Log in to GHCR"
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: "Push"
        if: github.event_name != 'pull_request'
        run: docker push "$IMAGE"

  manifest:
    name: "Publish multi-arch manifest (php${{ matrix.php-version }})"
    if: github.repository == 'phpstan/phpstan-src' && github.event_name != 'pull_request'
    needs: build
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      packages: write

    strategy:
      matrix:
        php-version: ["8.3", "8.4", "8.5"]

    env:
      TAG: "ghcr.io/phpstan/turbo-build:gnu-php${{ matrix.php-version }}"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: "Log in to GHCR"
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: "Create and push the manifest"
        run: docker buildx imagetools create -t "$TAG" "$TAG-amd64" "$TAG-arm64"

      - name: "Verify both platforms are present"
        run: |
          docker buildx imagetools inspect "$TAG" | tee manifest.txt
          grep -q "linux/amd64" manifest.txt
          grep -q "linux/arm64" manifest.txt
